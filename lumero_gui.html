<script>
// aplica o último tema já na abertura (evita piscar)
try { const t = localStorage.getItem("lumero-tema-efetivo"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
if (!document.documentElement.dataset.tema)
  document.documentElement.dataset.tema = matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro";
</script>

<style>
:root {
  --fundo: #1b1b1a; --lateral: #141413; --painel: #232322; --painel-2: #2b2b29;
  --borda: #34332f; --texto: #ecebe6; --suave: #a3a199; --fraco: #75736c;
  --balao: #2e2d2a; --ouro: #e9b528; --ouro-escuro: #c9951a; --ouro-texto: #1d1606;
  --perigo: #e5604f; --ok: #6cbf73; --codigo: #151514; --sombra: 0 10px 30px rgba(0,0,0,.35);
  --link: #f0c75e;
}
:root { color-scheme: dark; }
:root[data-tema="claro"] {
    color-scheme: light;
    --fundo: #faf9f6; --lateral: #f1efea; --painel: #ffffff; --painel-2: #f4f2ed;
    --borda: #e2dfd7; --texto: #1f1e1b; --suave: #66645d; --fraco: #9a978e;
    --balao: #efece5; --ouro: #e0a91c; --ouro-escuro: #b8860b; --ouro-texto: #1d1606;
    --perigo: #c8412f; --ok: #3d8b45; --codigo: #f6f4ef; --sombra: 0 10px 30px rgba(60,50,20,.12);
    --link: #9a6c00;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--fundo); color: var(--texto);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  display: flex; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
textarea, select, input { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--borda); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

/* ---------------------------------------------------------------- barra lateral */
#lateral {
  width: 264px; flex: none; background: var(--lateral); border-right: 1px solid var(--borda);
  display: flex; flex-direction: column; transition: margin-left .2s ease;
}
body.sem-lateral #lateral { margin-left: -264px; }
.marca { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px; font-weight: 650; font-size: 17px; }
.marca img { width: 30px; height: 30px; }
#nova {
  margin: 8px 10px 6px; padding: 9px 12px; border-radius: 10px; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--borda); background: var(--painel); font-weight: 550;
}
#nova:hover { border-color: var(--ouro-escuro); }
.rotulo-lista { padding: 12px 16px 4px; font-size: 12px; color: var(--fraco); text-transform: uppercase; letter-spacing: .04em; }
#conversas { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.item {
  display: flex; align-items: center; gap: 4px; border-radius: 8px; padding: 7px 8px 7px 10px;
  cursor: pointer; color: var(--suave); font-size: 14px;
}
.item:hover { background: var(--painel-2); color: var(--texto); }
.item.ativo { background: var(--painel-2); color: var(--texto); }
.item span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.item .acao { opacity: 0; padding: 2px 6px; border-radius: 6px; color: var(--fraco); }
.item:hover .acao { opacity: 1; }
.item .acao:hover { color: var(--texto); background: var(--borda); }
#rodape { padding: 10px 14px 12px; border-top: 1px solid var(--borda); font-size: 12px; color: var(--fraco); }
#rodape .linha { display: flex; align-items: center; gap: 6px; }
.ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--fraco); display: inline-block; }
.ponto.ok { background: var(--ok); } .ponto.erro { background: var(--perigo); }

/* ---------------------------------------------------------------- área principal */
#principal { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topo {
  height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-bottom: 1px solid transparent;
}
#topo.rolado { border-bottom-color: var(--borda); }
.botao-icone { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--suave); }
.botao-icone:hover { background: var(--painel-2); color: var(--texto); }
#titulo { flex: 1; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-left: 4px; }
.seletor {
  appearance: none; background: var(--painel); border: 1px solid var(--borda); border-radius: 9px;
  padding: 5px 28px 5px 10px; font-size: 13.5px; cursor: pointer; max-width: 200px;
  background-image: linear-gradient(45deg, transparent 50%, var(--suave) 50%), linear-gradient(135deg, var(--suave) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
}
.seletor:hover { border-color: var(--ouro-escuro); }
#falar.ligado { color: var(--ouro); }

#rolagem { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
#mensagens { max-width: 780px; margin: 0 auto; padding: 18px 22px 30px; }

/* tela inicial */
#inicio { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 62vh; padding: 20px; }
#inicio img { width: 76px; height: 76px; margin-bottom: 14px; filter: drop-shadow(0 6px 18px rgba(233,181,40,.25)); }
#inicio h1 { font-size: 27px; font-weight: 600; margin: 0 0 24px; letter-spacing: -.01em; }
.sugestoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(620px, 100%); }
.sugestao {
  text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--borda);
  background: var(--painel); font-size: 14px; line-height: 1.4;
}
.sugestao b { display: block; font-weight: 600; margin-bottom: 2px; }
.sugestao small { color: var(--suave); }
.sugestao:hover { border-color: var(--ouro-escuro); background: var(--painel-2); }
body.vazio #inicio { display: flex; }

/* mensagens */
.msg { margin: 22px 0; }
.msg.usuario { display: flex; flex-direction: column; align-items: flex-end; }
.balao {
  background: var(--balao); padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 82%;
  white-space: pre-wrap; word-wrap: break-word;
}
.anexos { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-bottom: 6px; max-width: 82%; }
.anexos img { max-height: 150px; max-width: 220px; border-radius: 12px; border: 1px solid var(--borda); }
.anexo-arq { font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--painel); border: 1px solid var(--borda); }
.msg.lumero { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; }
.msg.lumero > img { width: 30px; height: 30px; margin-top: 1px; }
.corpo { min-width: 0; }
/* menu de tema */
.menu-tema { position: relative; }
#opcoes-tema { display: none; position: absolute; right: 0; top: 40px; z-index: 30; min-width: 250px; padding: 6px;
  background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; box-shadow: var(--sombra); }
#opcoes-tema.aberto { display: block; }
#opcoes-tema .titulo-menu { font-size: 12px; color: var(--fraco); padding: 4px 10px 6px; }
#opcoes-tema button { white-space: nowrap; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 14px; }
#opcoes-tema button:hover { background: var(--painel-2); }
#opcoes-tema button .certo { margin-left: auto; color: var(--ouro); visibility: hidden; }
#opcoes-tema button.escolhido .certo { visibility: visible; }
/* sugestão em cinza e menu de comandos */
.campo { position: relative; }
#fantasma { position: absolute; inset: 0; pointer-events: none; padding: 4px 4px 2px; line-height: 1.5; font-size: 15.5px;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; color: transparent; overflow: hidden; }
#fantasma .resto { color: var(--fraco); }
#fantasma .tecla { display: inline-block; margin-left: 8px; padding: 0 6px; border: 1px solid var(--borda); border-radius: 5px; font-size: 11px; line-height: 17px; color: var(--fraco); vertical-align: 1px; }
#entrada { position: relative; }
#caixa { position: relative; }
#menu-cmd { display: none; position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 25; max-height: 300px; overflow-y: auto;
  background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; box-shadow: var(--sombra); padding: 6px; }
#menu-cmd.aberto { display: block; }
#menu-cmd .item { display: flex; gap: 12px; align-items: baseline; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
#menu-cmd .item.ativo { background: color-mix(in srgb, var(--ouro) 16%, var(--painel)); }
#menu-cmd .item b { font-weight: 600; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13.5px; white-space: nowrap; }
#menu-cmd .item span { color: var(--suave); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menu-cmd .rodape-menu { font-size: 11.5px; color: var(--fraco); padding: 6px 10px 2px; border-top: 1px solid var(--borda); margin-top: 4px; }
.balao.comando { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; }
.aviso { text-align: center; color: var(--fraco); font-size: 13px; margin: 14px 0; }
.aviso.erro { color: var(--perigo); }

/* texto formatado */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 12px; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 20px 0 8px; font-weight: 650; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.2em; } .md h3 { font-size: 1.07em; } .md h4 { font-size: 1em; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 24px; }
.md li { margin: 3px 0; }
.md a { color: var(--link); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--link) 40%, transparent); }
.md a:hover { border-bottom-color: var(--link); }
.md code { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace; font-size: .88em; background: var(--painel-2); padding: 1px 5px; border-radius: 5px; }
.md blockquote { margin: 0 0 12px; padding: 2px 14px; border-left: 3px solid var(--borda); color: var(--suave); }
.md hr { border: 0; border-top: 1px solid var(--borda); margin: 18px 0; }
.md table { border-collapse: collapse; margin: 0 0 14px; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--borda); padding: 6px 11px; text-align: left; }
.md th { background: var(--painel-2); font-weight: 600; }
.bloco-codigo { margin: 0 0 14px; border: 1px solid var(--borda); border-radius: 12px; overflow: hidden; background: var(--codigo); }
.bloco-codigo .cab { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fraco); padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--borda); }
.bloco-codigo .cab button { font-size: 12px; color: var(--suave); padding: 2px 8px; border-radius: 6px; }
.bloco-codigo .cab button:hover { background: var(--painel-2); color: var(--texto); }
.bloco-codigo pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
.bloco-codigo code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
.cursor::after { content: "▍"; color: var(--ouro); animation: piscar 1s steps(2) infinite; margin-left: 1px; }
@keyframes piscar { 50% { opacity: 0; } }

/* pensamento e ferramentas */
.pensamento, .ferramenta { margin: 0 0 10px; }
.cabeca {
  display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--suave);
  padding: 4px 10px 4px 8px; border-radius: 9px; border: 1px solid var(--borda); background: var(--painel);
  max-width: 100%; cursor: pointer; text-align: left;
}
.cabeca:hover { color: var(--texto); border-color: var(--fraco); }
.cabeca .nome { font-weight: 600; color: var(--texto); white-space: nowrap; }
.cabeca .det { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--suave); }
.cabeca .seta { transition: transform .15s; color: var(--fraco); font-size: 11px; }
.aberto > .cabeca .seta { transform: rotate(90deg); }
.detalhe-aberto { display: none; margin: 6px 0 4px; padding: 10px 12px; border-left: 2px solid var(--borda); color: var(--suave); font-size: 13.5px; white-space: pre-wrap; word-wrap: break-word; max-height: 340px; overflow-y: auto; }
.pensamento .detalhe-aberto { font-style: italic; }
.ferramenta .detalhe-aberto { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; }
.aberto > .detalhe-aberto { display: block; }
.icone-estado { width: 14px; height: 14px; display: inline-grid; place-items: center; flex: none; }
.girando { width: 12px; height: 12px; border: 2px solid var(--borda); border-top-color: var(--ouro); border-radius: 50%; animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.ferramenta.ok .icone-estado { color: var(--ok); }
.ferramenta.erro .icone-estado { color: var(--perigo); }
.logs { font-size: 12.5px; color: var(--fraco); margin: 2px 0 10px 10px; font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; }

/* cartão de permissão */
.cartao {
  border: 1px solid var(--ouro-escuro); background: color-mix(in srgb, var(--ouro) 7%, var(--painel));
  border-radius: 14px; padding: 14px 16px; margin: 4px 0 14px; box-shadow: var(--sombra);
}
.cartao.perigo { border-color: var(--perigo); background: color-mix(in srgb, var(--perigo) 7%, var(--painel)); }
.cartao h3 { margin: 0 0 6px; font-size: 15px; }
.cartao .det { color: var(--suave); font-size: 13.5px; white-space: pre-wrap; margin-bottom: 8px; }
.cartao pre { margin: 0 0 10px; padding: 10px 12px; background: var(--codigo); border: 1px solid var(--borda); border-radius: 9px; overflow-x: auto; font-size: 13px; }
.cartao .alerta { color: var(--perigo); font-size: 13.5px; margin-bottom: 10px; }
.cartao .botoes { display: flex; gap: 8px; }
.cartao .botoes button { padding: 7px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; }
.permitir { background: var(--ouro); color: var(--ouro-texto); }
.permitir:hover { background: var(--ouro-escuro); }
.cartao.perigo .permitir { background: var(--perigo); color: #fff; }
.negar { border: 1px solid var(--borda); background: var(--painel); }
.negar:hover { border-color: var(--fraco); }
.cartao.respondido { opacity: .65; box-shadow: none; }
.cartao.respondido .botoes { display: none; }
.cartao .resposta { font-size: 13px; color: var(--suave); }

#status { display: none; align-items: center; gap: 9px; color: var(--suave); font-size: 14px; margin: 4px 0 0 44px; }
#status.visivel { display: flex; }
.brilho { background: linear-gradient(90deg, var(--suave) 0%, var(--texto) 45%, var(--suave) 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: brilhar 2s linear infinite; }
@keyframes brilhar { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.acoes-msg { display: flex; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .15s; }
.msg.lumero:hover .acoes-msg { opacity: 1; }
.acoes-msg button { font-size: 12.5px; color: var(--fraco); padding: 3px 8px; border-radius: 7px; }
.acoes-msg button:hover { background: var(--painel-2); color: var(--texto); }

/* ---------------------------------------------------------------- caixa de texto */
#base { flex: none; padding: 0 22px 16px; }
#caixa {
  max-width: 780px; margin: 0 auto; background: var(--painel); border: 1px solid var(--borda);
  border-radius: 22px; padding: 10px 10px 10px 14px; box-shadow: var(--sombra);
  transition: border-color .15s;
}
#caixa:focus-within { border-color: color-mix(in srgb, var(--ouro) 55%, var(--borda)); }
#caixa.arrastando { border-color: var(--ouro); border-style: dashed; }
#entrada {
  width: 100%; resize: none; border: 0; outline: 0; background: transparent; max-height: 240px;
  min-height: 26px; padding: 4px 4px 2px; line-height: 1.5; font-size: 15.5px;
}
#entrada::placeholder { color: var(--fraco); }
.linha-caixa { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.linha-caixa .espaco { flex: 1; }
#enviar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--ouro); color: var(--ouro-texto);
  display: grid; place-items: center; transition: background .15s, opacity .15s;
}
#enviar:hover { background: var(--ouro-escuro); }
#enviar:disabled { opacity: .35; cursor: default; }
#enviar.parar { background: var(--texto); color: var(--fundo); }
#pendentes { display: flex; flex-wrap: wrap; gap: 6px; }
.pendente { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 6px 4px 4px; border-radius: 10px; background: var(--painel-2); border: 1px solid var(--borda); max-width: 220px; }
.pendente img { width: 34px; height: 34px; object-fit: cover; border-radius: 7px; }
.pendente .arq { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; background: var(--borda); font-size: 16px; }
.pendente span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pendente button { color: var(--fraco); padding: 0 4px; }
.dica { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--fraco); }
#contexto { font-size: 12px; color: var(--fraco); }

#faixa { display: none; max-width: 780px; margin: 0 auto 10px; padding: 10px 14px; border-radius: 12px; font-size: 14px; border: 1px solid var(--perigo); color: var(--perigo); background: color-mix(in srgb, var(--perigo) 8%, var(--painel)); }
#faixa.visivel { display: block; }

@media (max-width: 820px) {
  #lateral { position: fixed; z-index: 5; height: 100%; box-shadow: var(--sombra); }
  .sugestoes { grid-template-columns: 1fr; }
}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

async function api(caminho, dados) {
  const opcoes = { headers: { "X-Lumero-Token": TOKEN } };
  if (dados !== undefined) {
    opcoes.method = "POST";
    opcoes.headers["Content-Type"] = "application/json";
    opcoes.body = JSON.stringify(dados);
  }
  const r = await fetch(caminho, opcoes);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || ("erro " + r.status));
  return j;
}

/* ------------------------------------------------------------------ markdown */
function escapar(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(t) {
  const codigos = [];
  t = t.replace(/`([^`\n]+)`/g, (_, c) => { codigos.push(c); return "\u0000" + (codigos.length - 1) + "\u0000"; });
  t = escapar(t);
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, txt, url) => `<a href="${url}">${txt}</a>`);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, (_, a, url) => `${a}<a href="${url}">${url}</a>`);
  t = t.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+?)__/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>").replace(/(^|[^_\w])_([^_\n]+?)_(?!\w)/g, "$1<em>$2</em>");
  t = t.replace(/~~([^~\n]+?)~~/g, "<del>$1</del>");
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${escapar(codigos[+i])}</code>`);
}
function md(src, emAndamento) {
  src = (src || "").replace(/\r\n?/g, "\n");
  if (emAndamento && ((src.match(/^```/gm) || []).length % 2 === 1)) src += "\n```";
  const linhas = src.split("\n");
  let html = "", i = 0;
  const lista = [];
  const fecharListas = (nivel = 0) => { while (lista.length > nivel) html += `</${lista.pop()}>`; };
  while (i < linhas.length) {
    const l = linhas[i];
    let m;
    if ((m = l.match(/^\s*```\s*([\w+#.-]*)/))) {
      fecharListas();
      const ling = m[1]; const cod = []; i++;
      while (i < linhas.length && !/^\s*```\s*$/.test(linhas[i])) cod.push(linhas[i++]);
      i++;
      html += `<div class="bloco-codigo"><div class="cab"><span>${escapar(ling || "código")}</span><button class="copiar-codigo">Copiar</button></div><pre><code>${escapar(cod.join("\n"))}</code></pre></div>`;
      continue;
    }
    if (/^\s*$/.test(l)) { fecharListas(); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { fecharListas(); const n = Math.min(m[1].length, 4); html += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)) { fecharListas(); html += "<hr>"; i++; continue; }
    if (/^\s*>/.test(l)) {
      fecharListas(); const q = [];
      while (i < linhas.length && /^\s*>/.test(linhas[i])) q.push(linhas[i++].replace(/^\s*>\s?/, ""));
      html += `<blockquote>${md(q.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < linhas.length && /^\s*\|?\s*:?-{2,}/.test(linhas[i + 1])) {
      fecharListas();
      const celulas = s => s.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      html += "<table><thead><tr>" + celulas(l).map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < linhas.length && /^\s*\|.*\|\s*$/.test(linhas[i])) html += "<tr>" + celulas(linhas[i++]).map(c => `<td>${c}</td>`).join("") + "</tr>";
      html += "</tbody></table>"; continue;
    }
    if ((m = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
      const nivel = Math.floor(m[1].replace(/\t/g, "    ").length / 2) + 1;
      const tipo = /\d/.test(m[2]) ? "ol" : "ul";
      while (lista.length > nivel) html += `</${lista.pop()}>`;
      if (lista.length === nivel && lista[nivel - 1] !== tipo) html += `</${lista.pop()}>`;
      while (lista.length < nivel) { lista.push(tipo); html += `<${tipo}>`; }
      html += `<li>${inline(m[3])}</li>`; i++; continue;
    }
    fecharListas();
    const p = [];
    while (i < linhas.length && !/^\s*$/.test(linhas[i]) && !/^(#{1,6}\s|\s*```|\s*>|\s*([-*+]|\d+[.)])\s)/.test(linhas[i]) && !/^\s*\|.*\|\s*$/.test(linhas[i])) p.push(linhas[i++]);
    if (!p.length) { p.push(linhas[i++]); }
    html += `<p>${p.map(inline).join("<br>")}</p>`;
  }
  fecharListas();
  return html;
}

const caixaMsgs = $("#mensagens"), rolagem = $("#rolagem"), entrada = $("#entrada"), botaoEnviar = $("#enviar");
let ocupado = false, atual = null, colado = true, pendentes = [], conversaAtual = null;

function rolarFim(forcar) { if (forcar || colado) rolagem.scrollTop = rolagem.scrollHeight; }
rolagem.addEventListener("scroll", () => {
  colado = rolagem.scrollHeight - rolagem.scrollTop - rolagem.clientHeight < 80;
  $("#topo").classList.toggle("rolado", rolagem.scrollTop > 4);
});

function atualizarVazio() { document.body.classList.toggle("vazio", !caixaMsgs.children.length); }

function definirOcupado(sim) {
  ocupado = sim;
  botaoEnviar.classList.toggle("parar", sim);
  $("#ic-enviar").style.display = sim ? "none" : "";
  $("#ic-parar").style.display = sim ? "" : "none";
  botaoEnviar.title = sim ? "Parar" : "Enviar (Enter)";
  atualizarBotao();
}
function atualizarBotao() { botaoEnviar.disabled = !ocupado && !entrada.value.trim() && !pendentes.length; }

function msgUsuario(texto, anexos) {
  const m = el("div", "msg usuario");
  if (anexos && anexos.length) {
    const a = el("div", "anexos");
    for (const x of anexos) {
      if (x.miniatura) { const img = el("img"); img.src = x.miniatura; img.alt = x.nome; a.append(img); }
      else a.append(el("div", "anexo-arq", "📄 " + x.nome));
    }
    m.append(a);
  }
  if (texto) m.append(el("div", "balao", texto));
  caixaMsgs.append(m); atualizarVazio();
  return m;
}

function novoLumero() {
  const m = el("div", "msg lumero");
  const img = el("img"); img.src = ICONE; img.alt = "";
  const corpo = el("div", "corpo");
  const acoes = el("div", "acoes-msg");
  const copiar = el("button", "", "Copiar");
  copiar.onclick = () => copiarTexto(m.dataset.texto || corpo.innerText, copiar);
  acoes.append(copiar);
  m.append(img, corpo);
  corpo.append(acoes);
  caixaMsgs.append(m); atualizarVazio();
  return { el: m, corpo, acoes, texto: null, textoBruto: "", pensamento: null, ferramentas: {}, logs: null, inicioPensar: 0 };
}
function antesDasAcoes(r, no) { r.corpo.insertBefore(no, r.acoes); }

function blocoDobravel(classe, icone, nome, detalhe) {
  const b = el("div", classe);
  const cab = el("button", "cabeca");
  const ic = el("span", "icone-estado"); ic.innerHTML = icone;
  const n = el("span", "nome", nome);
  cab.append(ic, n);
  if (detalhe) cab.append(el("span", "det", detalhe));
  cab.append(el("span", "seta", "▶"));
  const det = el("div", "detalhe-aberto");
  cab.onclick = () => b.classList.toggle("aberto");
  b.append(cab, det);
  return { b, cab, ic, n, det };
}
const IC_GIRANDO = '<span class="girando"></span>';
const IC_OK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>';
const IC_ERRO = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const IC_PENSAR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>';

function addPensamento(r, texto, terminado, segundos) {
  if (!r.pensamento) {
    const d = blocoDobravel("pensamento", terminado ? IC_PENSAR : IC_GIRANDO, terminado ? "Raciocínio" : "Pensando…", "");
    if (!terminado) d.n.classList.add("brilho");
    r.pensamento = d; r.inicioPensar = Date.now();
    antesDasAcoes(r, d.b);
  }
  r.pensamento.det.textContent += texto;
  if (terminado) fecharPensamento(r, segundos);
}
function fecharPensamento(r, segundos) {
  if (!r.pensamento || r.pensamento.fechado) return;
  const s = segundos != null ? segundos : Math.max(1, Math.round((Date.now() - r.inicioPensar) / 1000));
  r.pensamento.ic.innerHTML = IC_PENSAR;
  r.pensamento.n.classList.remove("brilho");
  r.pensamento.n.textContent = segundos === null ? "Raciocínio" : `Pensou por ${s}s`;
  r.pensamento.fechado = true;
}

function addTexto(r, delta, final) {
  if (!r.texto) { r.texto = el("div", "md"); antesDasAcoes(r, r.texto); r.textoBruto = ""; }
  r.textoBruto += delta;
  r.texto.innerHTML = md(r.textoBruto, !final);
  r.texto.classList.toggle("cursor", !final);
}
function encerrarTexto(r) {
  if (r.texto) {
    r.texto.innerHTML = md(r.textoBruto, false); r.texto.classList.remove("cursor");
    r.el.dataset.texto = ((r.el.dataset.textoBase || "") + "\n\n" + r.textoBruto).trim();
    r.el.dataset.textoBase = r.el.dataset.texto;
    r.texto = null;
  }
}

function addFerramenta(r, id, nome, detalhe, resultado) {
  encerrarTexto(r); fecharPensamento(r); r.pensamento = null;
  const d = blocoDobravel("ferramenta", IC_GIRANDO, nome, detalhe);
  r.ferramentas[id] = d; antesDasAcoes(r, d.b);
  r.logs = null;
  if (resultado != null) terminarFerramenta(r, id, resultado, /^(Erro|O usuário não|Comando NÃO|Alteração NÃO)/.test(resultado));
  return d;
}
function terminarFerramenta(r, id, texto, erro) {
  const d = r.ferramentas[id]; if (!d) return;
  d.b.classList.add(erro ? "erro" : "ok");
  d.ic.innerHTML = erro ? IC_ERRO : IC_OK;
  d.det.textContent = texto || "(sem resultado)";
}
function addLog(r, texto) {
  if (!r.logs) { r.logs = el("div", "logs"); antesDasAcoes(r, r.logs); }
  const linhas = (r.logs.textContent ? r.logs.textContent.split("\n") : []).concat(texto).slice(-6);
  r.logs.textContent = linhas.join("\n");
}

function addCartao(r, ev) {
  encerrarTexto(r);
  const c = el("div", "cartao" + (ev.perigo ? " perigo" : ""));
  c.dataset.id = ev.id;
  c.append(el("h3", "", ev.titulo));
  if (ev.detalhes) c.append(el("div", "det", ev.detalhes));
  if (ev.codigo) { const pre = el("pre"); pre.append(el("code", "", ev.codigo)); c.append(pre); }
  if (ev.aviso) c.append(el("div", "alerta", "⚠️ " + ev.aviso));
  const botoes = el("div", "botoes");
  const sim = el("button", "permitir", "Permitir"), nao = el("button", "negar", "Negar");
  const responder = async ok => {
    sim.disabled = nao.disabled = true;
    try { await api("/api/confirmar", { id: ev.id, permitir: ok }); } catch (e) { sim.disabled = nao.disabled = false; }
  };
  sim.onclick = () => responder(true); nao.onclick = () => responder(false);
  botoes.append(sim, nao); c.append(botoes);
  antesDasAcoes(r, c);
  rolarFim(true);
  sim.focus();
}
function cartaoRespondido(id, permitido) {
  const c = document.querySelector(`.cartao[data-id="${id}"]`); if (!c) return;
  c.classList.add("respondido");
  c.append(el("div", "resposta", permitido ? "✓ Permitido" : "✕ Negado"));
}

function mostrarStatus(texto) {
  let s = $("#status");
  if (!s) { s = el("div"); s.id = "status"; }
  caixaMsgs.append(s);
  s.innerHTML = "";
  if (texto) {
    s.append(el("span", "girando"), el("span", "brilho", texto + "…"));
    s.classList.add("visivel");
  } else s.classList.remove("visivel");
  rolarFim();
}

function aviso(texto, erro) { caixaMsgs.append(el("div", "aviso" + (erro ? " erro" : ""), texto)); atualizarVazio(); rolarFim(); }

/* ------------------------------------------------------------------ desenhar conversa salva */
function desenhar(dados) {
  caixaMsgs.innerHTML = "";
  for (const b of dados.blocos) {
    if (b.papel === "usuario") msgUsuario(b.texto, b.anexos);
    else if (b.papel === "aviso") aviso(b.texto);
    else {
      const r = novoLumero();
      let n = 0;
      for (const p of b.partes) {
        if (p.tipo === "pensamento") { r.pensamento = null; addPensamento(r, p.texto, true, null); r.pensamento = null; }
        else if (p.tipo === "ferramenta") addFerramenta(r, "s" + (n++), p.nome, p.detalhe, p.resultado == null ? "" : p.resultado);
        else if (p.tipo === "texto") { addTexto(r, p.texto, true); encerrarTexto(r); }
      }
    }
  }
  $("#titulo").textContent = dados.blocos.length ? dados.titulo : "";
  conversaAtual = dados.id;
  atualizarVazio();
  rolarFim(true);
}
async function carregarConversa() {
  const d = await api("/api/conversa");
  desenhar(d);
  definirOcupado(d.ocupado);
  if (d.ocupado) { atual = novoLumero(); mostrarStatus("Respondendo"); }
}
async function carregarLista() {
  const d = await api("/api/conversas");
  const nav = $("#conversas"); nav.innerHTML = "";
  for (const c of d.conversas) {
    const it = el("div", "item" + (c.id === d.atual ? " ativo" : ""));
    const t = el("span", "", c.titulo); t.title = c.titulo;
    const ren = el("button", "acao", "✎"); ren.title = "Renomear";
    const del = el("button", "acao", "✕"); del.title = "Apagar";
    it.append(t, ren, del);
    it.onclick = async e => {
      if (e.target === del || e.target === ren || c.id === d.atual) return;
      if (ocupado) return;
      await api("/api/abrir", { id: c.id }); await carregarConversa(); await carregarLista();
    };
    ren.onclick = async () => {
      const novo = prompt("Novo nome da conversa:", c.titulo);
      if (novo && novo.trim()) { await api("/api/renomear", { id: c.id, titulo: novo.trim() }); carregarLista(); if (c.id === d.atual) $("#titulo").textContent = novo.trim(); }
    };
    del.onclick = async () => {
      if (!confirm(`Apagar a conversa "${c.titulo}"?`)) return;
      try { await api("/api/apagar", { id: c.id }); } catch (e) { return aviso(e.message, true); }
      if (c.id === d.atual) await carregarConversa();
      carregarLista();
    };
    nav.append(it);
  }
}

/* ------------------------------------------------------------------ estado geral */
function mostrarOllama(erro) {
  $("#ponto-ollama").className = "ponto " + (erro ? "erro" : "ok");
  $("#txt-ollama").textContent = erro ? "Ollama com problema" : "Ollama ligado · só neste computador";
  const f = $("#faixa");
  f.textContent = erro || ""; f.classList.toggle("visivel", !!erro);
}
function preencherModelos(lista, escolhido) {
  const s = $("#modelo"); s.innerHTML = "";
  const nomes = lista && lista.length ? lista : [escolhido];
  for (const n of nomes) { const o = el("option", "", n); o.value = n; s.append(o); }
  if (!nomes.includes(escolhido)) { const o = el("option", "", escolhido + " (não instalado)"); o.value = escolhido; s.append(o); }
  s.value = escolhido;
}
/* ------------------------------------------------------------------ tema */
let temaEscolhido = "auto", temaSistema = null;
const midiaClaro = matchMedia("(prefers-color-scheme: light)");
function aplicarTema(escolhido, sistema) {
  if (escolhido) temaEscolhido = escolhido;
  if (sistema !== undefined) temaSistema = sistema;
  const efetivo = temaEscolhido !== "auto" ? temaEscolhido : (temaSistema || (midiaClaro.matches ? "claro" : "escuro"));
  document.documentElement.dataset.tema = efetivo;
  try { localStorage.setItem("lumero-tema-efetivo", efetivo); } catch (e) {}
  document.querySelectorAll("#opcoes-tema button").forEach(b => b.classList.toggle("escolhido", b.dataset.tema === temaEscolhido));
  $("#tema").title = "Aparência: " + { auto: "automática", claro: "clara", escuro: "escura" }[temaEscolhido];
}
midiaClaro.addEventListener("change", () => aplicarTema());
$("#tema").onclick = e => { e.stopPropagation(); $("#opcoes-tema").classList.toggle("aberto"); };
document.addEventListener("click", e => { if (!e.target.closest(".menu-tema")) $("#opcoes-tema").classList.remove("aberto"); });
document.querySelectorAll("#opcoes-tema button").forEach(b => b.onclick = async () => {
  $("#opcoes-tema").classList.remove("aberto");
  aplicarTema(b.dataset.tema);
  try { const e = await api("/api/config", { tema: b.dataset.tema }); aplicarTema(e.tema, e.tema_sistema); }
  catch (err) { aviso(err.message, true); }
});
window.addEventListener("focus", () => { if (temaEscolhido === "auto") api("/api/estado").then(e => aplicarTema(e.tema, e.tema_sistema)).catch(() => {}); });
setInterval(() => { if (temaEscolhido === "auto" && document.hasFocus()) api("/api/estado").then(e => aplicarTema(e.tema, e.tema_sistema)).catch(() => {}); }, 15000);

async function carregarEstado() {
  const e = await api("/api/estado");
  aplicarTema(e.tema, e.tema_sistema);
  preencherModelos(e.modelos, e.modelo);
  $("#pensar").value = e.pensar;
  $("#falar").classList.toggle("ligado", e.falar);
  $("#versao").textContent = `Lumero ${e.versao} · ${e.sistema}`;
  if (e.ollama_erro !== null || e.modelos.length) mostrarOllama(e.ollama_erro);
  $("#contexto").textContent = e.contexto ? `contexto ${e.contexto}%` : "";
  const hora = new Date().getHours();
  const periodo = hora < 5 ? "Boa noite" : hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";
  $("#saudacao").textContent = `${periodo}${e.nome ? ", " + e.nome : ""}! Como posso ajudar?`;
  document.documentElement.dataset.so = e.so;
}

/* ------------------------------------------------------------------ eventos do servidor */
function conectar() {
  const fonte = new EventSource("/api/eventos?t=" + encodeURIComponent(TOKEN));
  fonte.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.tipo === "ollama") { mostrarOllama(ev.erro); if (ev.modelos && ev.modelos.length) preencherModelos(ev.modelos, $("#modelo").value); return; }
    if (ev.tipo === "titulo") { $("#titulo").textContent = ev.titulo; carregarLista(); return; }
    if (!atual && ["texto", "pensamento", "ferramenta", "confirmar", "log", "status"].includes(ev.tipo)) {
      if (ev.tipo === "status" && !ev.texto) return;
      atual = novoLumero();
    }
    switch (ev.tipo) {
      case "status": mostrarStatus(ev.texto); break;
      case "pensamento": addPensamento(atual, ev.texto, false); mostrarStatus(""); break;
      case "texto": fecharPensamento(atual); addTexto(atual, ev.texto, false); mostrarStatus(""); break;
      case "ferramenta": addFerramenta(atual, ev.id, ev.nome, ev.detalhe); break;
      case "resultado": terminarFerramenta(atual, ev.id, ev.texto, ev.erro); break;
      case "log": addLog(atual, ev.texto); break;
      case "confirmar": addCartao(atual, ev); break;
      case "confirmado": cartaoRespondido(ev.id, ev.permitido); break;
      case "aviso": aviso(ev.texto); break;
      case "erro": aviso(ev.texto, true); break;
      case "fim":
        if (atual) { encerrarTexto(atual); fecharPensamento(atual); if (!atual.corpo.children.length || atual.corpo.children.length === 1) atual.el.remove(); }
        atual = null; mostrarStatus(""); definirOcupado(false);
        $("#contexto").textContent = ev.contexto ? `contexto ${ev.contexto}%` : "";
        conversaAtual = ev.id; carregarLista(); entrada.focus(); pedirSugestoes();
        break;
    }
    rolarFim();
  };
  fonte.onerror = () => { /* o navegador reconecta sozinho */ };
  fonte.onopen = () => { carregarEstado().catch(() => {}); };
}

/* ------------------------------------------------------------------ enviar */
const ehComando = t => /^\/[^\s\/]+(\s|$)/.test(t);
async function rodarComando(texto) {
  fecharMenu(); entrada.value = ""; ajustarAltura(); limparFantasma();
  const m = msgUsuario(texto); m.querySelector(".balao").classList.add("comando");
  rolarFim(true);
  let r;
  try { r = await api("/api/enviar", { texto, anexos: [] }); }
  catch (e) { aviso(e.message, true); return; }
  if (r.acao === "recarregar") { await carregarConversa(); carregarLista(); }
  if (r.texto) { const b = novoLumero(); addTexto(b, r.texto, true); encerrarTexto(b); b.el.classList.add("resposta-comando"); }
  if (r.estado) {
    const e = r.estado;
    preencherModelos(e.modelos, e.modelo); $("#pensar").value = e.pensar;
    $("#falar").classList.toggle("ligado", e.falar); aplicarTema(e.tema, e.tema_sistema);
    carregarEstado().catch(() => {});
    $("#contexto").textContent = e.contexto ? `contexto ${e.contexto}%` : "";
  }
  rolarFim(true); entrada.focus(); pedirSugestoes();
}
async function enviar(textoForcado) {
  if (ocupado) { api("/api/parar", {}).catch(() => {}); return; }
  const texto = (textoForcado != null ? textoForcado : entrada.value).trim();
  if (!texto && !pendentes.length) return;
  if (ehComando(texto) && !pendentes.length) return rodarComando(texto);
  fecharMenu(); limparFantasma();
  const anexos = pendentes.map(p => ({ nome: p.nome, tipo: p.tipo, dados: p.dados }));
  msgUsuario(texto, pendentes.map(p => ({ nome: p.nome, miniatura: p.previa })));
  entrada.value = ""; ajustarAltura(); pendentes = []; desenharPendentes();
  definirOcupado(true); colado = true; rolarFim(true);
  atual = null; mostrarStatus("Pensando");
  try { await api("/api/enviar", { texto, anexos }); }
  catch (e) { mostrarStatus(""); aviso(e.message, true); definirOcupado(false); }
}
function ajustarAltura() { entrada.style.height = "auto"; entrada.style.height = Math.min(entrada.scrollHeight, 240) + "px"; atualizarBotao(); }
entrada.addEventListener("input", () => { ajustarAltura(); pedirSugestoes(); });

/* ------------------------------------------------------------------ menu de comandos e sugestão em cinza */
const menu = $("#menu-cmd"), fantasma = $("#fantasma");
const PLACEHOLDER = entrada.placeholder;
let itensMenu = [], ativo = 0, sugestao = "", pedido = 0, temporizador = null;
const COM_OPCOES = ["/pensar", "/modelo", "/tema", "/extras", "/retomar"];
function pedirSugestoes() {
  clearTimeout(temporizador);
  temporizador = setTimeout(async () => {
    const texto = entrada.value, n = ++pedido;
    if (texto.length > 400 || texto.includes("\n")) { fecharMenu(); limparFantasma(); return; }
    let r;
    try { r = await api("/api/completar?texto=" + encodeURIComponent(texto)); } catch (e) { return; }
    if (n !== pedido || entrada.value !== texto) return;
    const palavra = texto.split(" ").pop();
    const mostrarMenu = r.itens.length && (texto.startsWith("/") || /^(~\/|\/)/.test(palavra))
                        && !(r.itens.length === 1 && r.itens[0].texto === (texto.startsWith("/") && !texto.includes(" ") ? texto : palavra));
    if (mostrarMenu) abrirMenu(r.itens); else fecharMenu();
    mostrarFantasma(mostrarMenu ? "" : r.sugestao);
  }, texto_rapido() ? 0 : 90);
}
function texto_rapido() { return entrada.value === "" || entrada.value === "/"; }
function abrirMenu(itens) {
  itensMenu = itens; ativo = 0; menu.innerHTML = "";
  itens.forEach((it, i) => {
    const d = el("div", "item" + (i === 0 ? " ativo" : "")); d.setAttribute("role", "option");
    d.append(el("b", "", it.texto), el("span", "", it.descricao || ""));
    d.onmousedown = ev => { ev.preventDefault(); ativo = i; aplicarItem(true); };
    menu.append(d);
  });
  menu.append(el("div", "rodape-menu", "↑ ↓ escolher · Tab completar · Enter usar · Esc fechar"));
  menu.classList.add("aberto");
}
function fecharMenu() { menu.classList.remove("aberto"); itensMenu = []; }
function marcarAtivo(n) {
  ativo = (n + itensMenu.length) % itensMenu.length;
  menu.querySelectorAll(".item").forEach((x, i) => x.classList.toggle("ativo", i === ativo));
  const a = menu.querySelectorAll(".item")[ativo]; if (a) a.scrollIntoView({ block: "nearest" });
}
function aplicarItem(executar) {
  const it = itensMenu[ativo]; if (!it) return;
  const antes = entrada.value.slice(0, entrada.value.length - it.substituir);
  let novo = antes + it.texto;
  const ehCmd = novo.startsWith("/") && !novo.includes(" ");
  if (ehCmd && COM_OPCOES.includes(novo)) { novo += " "; executar = false; }
  entrada.value = novo; ajustarAltura(); fecharMenu();
  entrada.setSelectionRange(novo.length, novo.length);
  if (executar && ehComando(novo)) { rodarComando(novo.trim()); return; }
  pedirSugestoes();
}
function mostrarFantasma(resto) {
  sugestao = resto || "";
  const noFim = entrada.selectionStart === entrada.value.length && entrada.selectionEnd === entrada.value.length;
  if (!sugestao || !noFim || entrada.scrollHeight > entrada.clientHeight + 2) { limparFantasma(); return; }
  fantasma.innerHTML = "";
  fantasma.append(document.createTextNode(entrada.value), el("span", "resto", sugestao), el("span", "tecla", "Tab"));
  entrada.placeholder = entrada.value ? PLACEHOLDER : "";
}
function limparFantasma() { sugestao = ""; fantasma.innerHTML = ""; entrada.placeholder = PLACEHOLDER; }
function aceitarSugestao() {
  entrada.value += sugestao; limparFantasma(); ajustarAltura();
  entrada.setSelectionRange(entrada.value.length, entrada.value.length); pedirSugestoes();
}
entrada.addEventListener("keydown", e => {
  if (e.isComposing) return;
  if (menu.classList.contains("aberto") && itensMenu.length) {
    if (e.key === "ArrowDown") { e.preventDefault(); return marcarAtivo(ativo + 1); }
    if (e.key === "ArrowUp") { e.preventDefault(); return marcarAtivo(ativo - 1); }
    if (e.key === "Tab") { e.preventDefault(); return aplicarItem(false); }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); return aplicarItem(true); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return fecharMenu(); }
  }
  if (sugestao && (e.key === "Tab" || (e.key === "ArrowRight" && entrada.selectionStart === entrada.value.length))) {
    e.preventDefault(); return aceitarSugestao();
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const t = entrada.value.trim();
    if (ehComando(t) && !pendentes.length) rodarComando(t); else if (!ocupado) enviar();
  }
});
entrada.addEventListener("keyup", e => { if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) mostrarFantasma(sugestao); });
entrada.addEventListener("click", () => mostrarFantasma(sugestao));
entrada.addEventListener("blur", () => setTimeout(fecharMenu, 120));
entrada.addEventListener("focus", () => pedirSugestoes());
entrada.addEventListener("scroll", () => { fantasma.scrollTop = entrada.scrollTop; });
botaoEnviar.onclick = () => enviar();
document.querySelectorAll(".sugestao").forEach(b => b.onclick = () => enviar(b.dataset.texto));

/* ------------------------------------------------------------------ anexos */
function lerArquivo(arq) {
  return new Promise((ok, falha) => {
    const fr = new FileReader();
    fr.onload = () => ok(fr.result); fr.onerror = falha;
    fr.readAsDataURL(arq);
  });
}
async function adicionarArquivos(lista) {
  for (const arq of lista) {
    if (arq.size > 30 * 1024 * 1024) { aviso(`${arq.name} passa de 30 MB.`, true); continue; }
    const url = await lerArquivo(arq);
    pendentes.push({ nome: arq.name || "imagem.png", tipo: arq.type || "", dados: url.split(",")[1] || "", previa: arq.type.startsWith("image/") ? url : null });
  }
  desenharPendentes(); entrada.focus();
}
function desenharPendentes() {
  const c = $("#pendentes"); c.innerHTML = "";
  pendentes.forEach((p, i) => {
    const d = el("div", "pendente");
    if (p.previa) { const img = el("img"); img.src = p.previa; d.append(img); } else d.append(el("div", "arq", "📄"));
    d.append(el("span", "", p.nome));
    const x = el("button", "", "✕"); x.title = "Tirar"; x.onclick = () => { pendentes.splice(i, 1); desenharPendentes(); };
    d.append(x); c.append(d);
  });
  atualizarBotao();
}
$("#anexar").onclick = () => $("#arquivo").click();
$("#arquivo").onchange = e => { adicionarArquivos([...e.target.files]); e.target.value = ""; };
entrada.addEventListener("paste", e => {
  const arquivos = [...(e.clipboardData || {}).files || []];
  if (arquivos.length) { e.preventDefault(); adicionarArquivos(arquivos); }
});
const caixa = $("#caixa");
document.addEventListener("dragover", e => { e.preventDefault(); caixa.classList.add("arrastando"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) caixa.classList.remove("arrastando"); });
document.addEventListener("drop", e => { e.preventDefault(); caixa.classList.remove("arrastando"); if (e.dataTransfer.files.length) adicionarArquivos([...e.dataTransfer.files]); });

/* ------------------------------------------------------------------ outros controles */
function copiarTexto(texto, botao) {
  const feito = () => { const antes = botao.textContent; botao.textContent = "Copiado ✓"; setTimeout(() => botao.textContent = antes, 1400); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(feito, () => copiaAntiga(texto, feito));
  else copiaAntiga(texto, feito);
}
function copiaAntiga(texto, feito) {
  const t = el("textarea"); t.value = texto; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.append(t); t.select(); try { document.execCommand("copy"); feito(); } catch (e) {} t.remove();
}
caixaMsgs.addEventListener("click", e => {
  const b = e.target.closest(".copiar-codigo");
  if (b) { copiarTexto(b.closest(".bloco-codigo").querySelector("code").textContent, b); return; }
  const a = e.target.closest("a[href]");
  if (a) { e.preventDefault(); api("/api/link", { url: a.href }).catch(err => aviso(err.message, true)); }
});
$("#nova").onclick = async () => {
  if (ocupado) return aviso("Espere a resposta terminar (ou aperte ■ para parar).", true);
  await api("/api/nova", {}); caixaMsgs.innerHTML = ""; $("#titulo").textContent = "";
  atualizarVazio(); carregarLista(); $("#contexto").textContent = ""; entrada.focus();
};
$("#alternar-lateral").onclick = () => document.body.classList.toggle("sem-lateral");
$("#modelo").onchange = async e => {
  try { await api("/api/config", { modelo: e.target.value }); aviso(`Modelo trocado para ${e.target.value}.`); }
  catch (err) { aviso(err.message, true); carregarEstado(); }
};
$("#pensar").onchange = e => api("/api/config", { pensar: e.target.value }).catch(err => aviso(err.message, true));
$("#falar").onclick = async () => {
  const ligar = !$("#falar").classList.contains("ligado");
  const e = await api("/api/config", { falar: ligar });
  $("#falar").classList.toggle("ligado", e.falar);
  aviso(e.falar ? "As respostas serão lidas em voz alta." : "Leitura em voz alta desligada.");
};
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); $("#nova").click(); }
  if (e.key === "Escape" && ocupado) api("/api/parar", {}).catch(() => {});
});
window.addEventListener("pagehide", () => {
  try { navigator.sendBeacon && fetch("/api/fechei", { method: "POST", keepalive: true, headers: { "X-Lumero-Token": TOKEN, "Content-Type": "application/json" }, body: "{}" }); } catch (e) {}
});
setInterval(() => api("/api/vivo", {}).catch(() => {}), 20000);
const estreita = window.matchMedia("(max-width: 820px)");
const ajustarLateral = () => document.body.classList.toggle("sem-lateral", estreita.matches);
estreita.addEventListener("change", ajustarLateral); ajustarLateral();
$("#principal").addEventListener("click", e => {  // tela estreita: clicar fora fecha a lista
  if (estreita.matches && !e.target.closest("#alternar-lateral")) document.body.classList.add("sem-lateral");
});

(async () => {
  if (!TOKEN) { document.body.innerHTML = "<p style='padding:40px'>Abra o Lumero pelo atalho do menu.</p>"; return; }
  try { await carregarEstado(); await carregarConversa(); await carregarLista(); } catch (e) { aviso("Não consegui falar com o Lumero: " + e.message, true); }
  conectar();
  entrada.focus();
})();
</script>
</body>
