<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- fundo escuro para o dourado brilhar -->
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b33"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <!-- face do L: amarelo metalizado com faixas de reflexo -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.18" stop-color="#ffe066"/>
      <stop offset="0.42" stop-color="#e2a700"/>
      <stop offset="0.55" stop-color="#fff0a3"/>
      <stop offset="0.68" stop-color="#f2c21b"/>
      <stop offset="0.88" stop-color="#b98300"/>
      <stop offset="1" stop-color="#e8b923"/>
    </linearGradient>
    <!-- lateral (profundidade) -->
    <linearGradient id="lateral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c7206"/>
      <stop offset="1" stop-color="#4f3a04"/>
    </linearGradient>
    <!-- brilho suave do glint -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fff6c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <path id="letra" d="M40 22 H60 V78 H94 V97 H40 Z"/>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#fundo)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="23.5" fill="none" stroke="#3d3d47" stroke-width="1"/>

  <g transform="translate(16 1) skewX(-14)">
    <!-- profundidade: camadas deslocadas para baixo e para a direita -->
    <use href="#letra" transform="translate(7.5 7.5)" fill="#3e2e03"/>
    <use href="#letra" transform="translate(7.0 7.0)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(6.5 6.5)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(6.0 6.0)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(5.5 5.5)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(5.0 5.0)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(4.5 4.5)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(4.0 4.0)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(3.5 3.5)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(3.0 3.0)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(2.5 2.5)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(2.0 2.0)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(1.5 1.5)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(1.0 1.0)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(0.5 0.5)" fill="url(#lateral)"/>
    <use href="#letra" transform="translate(0.5 0.5)" fill="#a77b07"/>
    <!-- face da frente -->
    <use href="#letra" fill="url(#metal)"/>
    <!-- chanfro: luz nas bordas de cima e da esquerda -->
    <path d="M40.8 96.2 V22.8 H59.2" fill="none" stroke="#fffbe0" stroke-width="1.6" stroke-opacity="0.85"/>
    <path d="M60.8 78.8 H93.2" fill="none" stroke="#fffbe0" stroke-width="1.2" stroke-opacity="0.7"/>
    <path d="M59.2 23 V78 M93.2 79 V96.2 H41" fill="none" stroke="#7a5a05" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- glint no topo direito do L -->
  <g transform="translate(71.5 23)">
    <circle r="13" fill="url(#halo)"/>
    <path d="M0 -15 L2.2 -2.2 L15 0 L2.2 2.2 L0 15 L-2.2 2.2 L-15 0 L-2.2 -2.2 Z" fill="#ffffff"/>
    <path d="M0 -7 L1 -1 L7 0 L1 1 L0 7 L-1 1 L-7 0 L-1 -1 Z" fill="#ffffff" transform="rotate(45)" opacity="0.85"/>
  </g>
</svg>
